spring.application.name=slotmind
server.port=8080
spring.datasource.url=jdbc:h2:mem:slotmind;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
slotmind.scheduling.strategy=${SLOTMIND_SCHEDULING_STRATEGY:rule-based}
slotmind.llm.base-url=${SLOTMIND_LLM_BASE_URL:https://litellm-qc.zycus.net/v1}
slotmind.llm.model=${SLOTMIND_LLM_MODEL:qwen-cursor}
slotmind.llm.product=${SLOTMIND_LLM_PRODUCT:PC1}